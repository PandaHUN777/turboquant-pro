[package]
name = "tqvector"
version = "0.1.0"
edition = "2021"
description = "TurboQuant compressed vector type for PostgreSQL — with optional GPU acceleration"
license = "MIT"
authors = ["Andrew H. Bond <andrew.bond@sjsu.edu>"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg16"]
pg14 = ["pgrx/pg14"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg_test = []
gpu = ["cudarc"]

# pgrx's pg_module_magic! expands to cfg checks for every PostgreSQL release
# it knows about, including ones this crate does not offer as a feature.
# Declaring the expected values keeps `unexpected_cfgs` useful for real typos
# instead of firing on generated code (issue #163).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("pg12", "pg13"))',
] }
[dependencies]
pgrx = "0.12"
serde = { version = "1", features = ["derive"] }
cudarc = { version = "0.12", features = ["std", "driver", "nvrtc", "cuda-12000"], optional = true }

[dev-dependencies]
pgrx-tests = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
